# Board: Generic ESP32 Board (Generic)
# Definition: definitions/boards/generic-esp32/manifest.yaml

esphome:
  name: projector-screen-controller
  friendly_name: Projector Screen Controller
  on_boot:
    priority: -200        # run after the stepper component itself has initialized
    then:
      - stepper.report_position:
          id: cl86y_motor
          position: !lambda 'return id(saved_step_position);'
      - stepper.set_target:
          id: cl86y_motor
          target: !lambda 'return id(saved_step_position);'    
 

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: "+UQvVYi9g7AyFbU4rjWxlmRvW8AzdUU8ts8MAwvlMxQ="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Projector Scree Fallback Hotspot
    password: "XND3kKHw7ynY"


web_server:
  port: 80    

captive_portal:



substitutions:
  steps_per_unit: "23200.0"   # 20000 stepper steps = 1 HA "unit" — tweak this one value to change resolution
    

globals:
  - id: homing_active
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: move_direction
    type: int8_t
    restore_value: no
    initial_value: '0'        # +1 = moving up, -1 = moving down, 0 = stopped
  - id: net_pulse_position
    type: int32_t
    restore_value: yes        # <-- persists across power loss / reboot
    initial_value: '0'
  - id: last_pulse_total
    type: float
    restore_value: no
    initial_value: '0'
  - id: saved_step_position
    type: int32_t
    restore_value: yes      # <-- persists the last resting step count across reboot
    initial_value: '0'
  - id: stepper_was_moving
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 1s
    then:
      - lambda: |-
          bool moving_now = (id(cl86y_motor).current_position != id(cl86y_motor).target_position);
          if (id(stepper_was_moving) && !moving_now) {
            // just came to a stop — this is the only time we write to flash
            id(saved_step_position) = id(cl86y_motor).current_position;
          }
          id(stepper_was_moving) = moving_now;    

# --- Optional: Manual Enable Switch (mirrors enable pin) ---
switch:
  - platform: gpio
    name: "Stepper Enable"
    pin:
      number: GPIO25
      mode:
        output: true
  - platform: gpio
    id: main_power_switch
    name: "Main Power"
    pin:
      number: GPIO33
      mode:
        output: true
      inverted: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: power_off_timer   # start the idle clock as soon as power comes on

script:
  - id: power_off_timer
    mode: restart          # calling execute while it's already running just resets the delay
    then:
      - delay: 10min
      - logger.log: "⏱️ 10 min idle — turning off Main Power"
      - switch.turn_off: main_power_switch
      

    
stepper:
  - platform: a4988
    id: cl86y_motor
    step_pin: GPIO27
    dir_pin:
      number: GPIO26
      inverted: true
    
    max_speed: 1000 steps/s
    acceleration: 2000
    deceleration: 2000


# ---------------- LIMIT SWITCH ----------------
binary_sensor:
  - platform: gpio
    id: limit_switch
    name: "Home Limit Switch"
    pin:
      number: GPIO12
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - logger.log: "limit hit time"
      - script.execute: power_off_timer
      - if:
          condition:
            lambda: 'return id(homing_active);'
          then:
            - logger.log: "🏠 HOME reached"
            - globals.set:
                id: move_direction
                value: '0'
            - stepper.set_target:
                id: cl86y_motor
                target: !lambda 'return id(cl86y_motor).current_position;'
            - globals.set:
                id: move_direction
                value: '1'          # backing off is a positive/up move
            - stepper.set_target:
                id: cl86y_motor
                target: 500
            - stepper.report_position:
                id: cl86y_motor
                position: 0
            # Zero the pulse-sensor position to match the stepper's zero
            - lambda: |-
                // Zero everything that tracks position immediately — don't wait on the save-on-stop interval
                id(saved_step_position) = 0;
                id(net_pulse_position) = 0;
                id(last_pulse_total) = id(sensor_pulse_total).state;
                id(net_screen_pulses).publish_state(0);
            - globals.set:
                id: homing_active
                value: 'false'
          else:
            - logger.log: "⚠️ Limit switch hit unexpectedly — safety stop + resync"
            - globals.set:
                id: move_direction
                value: '0'
            - stepper.set_target:
                id: cl86y_motor
                target: !lambda 'return id(cl86y_motor).current_position;'
            - stepper.report_position:
                id: cl86y_motor
                position: 0
            # Zero the pulse-sensor position to match the stepper's zero
            - lambda: |-
                // Zero everything that tracks position immediately — don't wait on the save-on-stop interval
                id(saved_step_position) = 0;
                id(net_pulse_position) = 0;
                id(last_pulse_total) = id(sensor_pulse_total).state;
                id(net_screen_pulses).publish_state(0);
            - globals.set:
                id: move_direction
                value: '1'          # backing off is a positive/up move
            - stepper.set_target:
                id: cl86y_motor
                target: 500
            - globals.set:
                id: homing_active
                value: 'false'

# ---------------- HOME / STOP BUTTONS ----------------
button:
  - platform: template
    name: "Home Screen"
    on_press:
      - script.execute: power_off_timer
      - logger.log: "Starting homing routine"
      - globals.set:
          id: homing_active
          value: 'true'
      - globals.set:
          id: move_direction
          value: '-1'
      - stepper.set_target:
          id: cl86y_motor
          target: -30000

  - platform: template
    name: "Stop Screen"
    on_press:
      - script.execute: power_off_timer
      - logger.log: "🛑 Stop requested"
      - globals.set:
          id: homing_active
          value: 'false'
      - globals.set:
          id: move_direction
          value: '0'
      - stepper.set_target:
          id: cl86y_motor
          target: !lambda 'return id(cl86y_motor).current_position;'

# ---------------- POSITION CONTROL ----------------
number:
  - platform: template
    name: "Screen Target Position"
    unit_of_measurement: "units"
    min_value: 0
    max_value: 11
    step: 1
    optimistic: true
    restore_value: true      # <-- remembers the last value set, across reboot
    set_action:
      - script.execute: power_off_timer
      - if:
          condition:
            lambda: 'return !id(homing_active);'
          then:
            - lambda: |-
                int32_t target_steps = (int32_t) round(x * $steps_per_unit);
                int32_t current = id(cl86y_motor).current_position;
                if (target_steps > current) id(move_direction) = 1;
                else if (target_steps < current) id(move_direction) = -1;
                else id(move_direction) = 0;
            - stepper.set_target:
                id: cl86y_motor
                target: !lambda 'return (int32_t) round(x * $steps_per_unit);'

sensor:
  - platform: template
    name: "Screen Current Position"
    id: stepper_position
    unit_of_measurement: "units"
    update_interval: 500ms
    accuracy_decimals: 1
    lambda: |-
      return id(cl86y_motor).current_position / $steps_per_unit;

  - platform: pulse_counter
    id: raw_pulse_rate
    pin:
      number: GPIO15
      mode: INPUT_PULLUP
      inverted: true
    name: "Sensor Pulse Rate"
    update_interval: 1s
    accuracy_decimals: 0
    unit_of_measurement: "pulses"
    internal: true             # set to false if you want the raw rate visible too
    total:
      id: sensor_pulse_total
      name: "Sensor Total Position Count"
      unit_of_measurement: "steps"
      accuracy_decimals: 0
      internal: true 
      on_value:
        then:
          - lambda: |-
              float delta = x - id(last_pulse_total);
              id(last_pulse_total) = x;
              id(net_pulse_position) += (int32_t) round(delta * id(move_direction));
              id(net_screen_pulses).publish_state(id(net_pulse_position));

  - platform: template
    name: "Screen Sensor Position"
    id: net_screen_pulses
    unit_of_measurement: "steps"
    accuracy_decimals: 0
